# Optional local observability runner; not needed to reproduce published
# numbers. Use config/openrouter.yaml for the public, API-key-based path.
# Point the source and runtime variables at the observability install, e.g.:
#   export MODELLAB_OBS_SOURCE=/path/to/automation/observability
#   export MODELLAB_OBS_DB=~/.local/share/workspace-observability/obs.db
obs:
  db_path: ${MODELLAB_OBS_DB}
  server_url: http://127.0.0.1:43190
  token: devtoken
  pool: benchmark
  extension_path: ${MODELLAB_OBS_SOURCE}/extension/pi-observability.ts
pi_version: "0.80.7"
pi:
  # Every Pi benchmark uses the same deliberate reasoning budget. This is
  # forwarded verbatim as `pi --thinking high`, including judge calls.
  thinking: high
prices:
  # An entry here OVERRIDES the provider-reported cost for that model (see
  # priceOverride in harness/src/config.ts). Only list models pi prices wrong
  # or not at all; omit models whose telemetry cost is already correct.
  "anthropic/claude-fable-5": { input_per_mtok: 10, output_per_mtok: 50 }
